<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunyag</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<div class="wrap">
  <header>
    <h1>Bunyag</h1>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></div>
  </header>
 
  <div class="grid">
    <div class="card">
      <h2>Soil moisture</h2>
      <div class="hero">
        <div class="ring-wrap">
          <svg viewBox="0 0 148 148">
            <circle class="ring-bg" cx="74" cy="74" r="64"/>
            <circle class="ring-fg" id="ringFg" cx="74" cy="74" r="64" stroke-dasharray="0 402"/>
          </svg>
          <div class="ring-label">
            <div class="num" id="moistureNum">--</div>
            <div class="unit">percent</div>
          </div>
        </div>
        <div class="hero-meta">
          <p><span class="pump-state off" id="pumpBadge">Pump idle</span></p>
          <p>Last reading: <strong id="lastUpdate">--</strong></p>
          <p>Raw sensor value: <strong id="rawVal">--</strong></p>
        </div>
      </div>
    </div>
 
    <div class="card">
      <h2>Controls</h2>
      <div class="field toggle-row">
        <label style="margin:0">Automatic watering</label>
        <label class="switch">
          <input type="checkbox" id="autoToggle">
          <span class="slider-track"></span>
        </label>
      </div>
      <br>
      <div class="field">
        <label>Water below <span class="val" id="threshVal">30</span>% moisture</label>
        <input type="range" id="threshRange" min="0" max="100" value="30">
      </div>
      <div class="field">
        <label>Watering duration (seconds)</label>
        <input type="number" id="durationInput" min="1" max="60" value="5">
      </div>
      <div class="field">
        <label>Cooldown between cycles (seconds)</label>
        <input type="number" id="cooldownInput" min="10" max="3600" value="60">
      </div>
      <button class="primary" id="manualBtn">Water now</button>
    </div>
 
    <div class="card">
      <h2>Watering stats</h2>
      <div class="stat-row">
        <div>
          <div class="stat-label">Last watered</div>
          <div class="stat-value" id="lastWateredVal">--</div>
        </div>
        <div>
          <div class="stat-label">Waterings today</div>
          <div class="stat-value" id="wateringsTodayVal">--</div>
        </div>
        <div>
          <div class="stat-label">Total logged</div>
          <div class="stat-value" id="wateringsTotalVal">--</div>
        </div>
      </div>
    </div>
 
    <div class="card chart-card">
      <h2>Moisture history</h2>
      <div id="chartHolder"><p class="chart-empty">Waiting for readings…</p></div>
    </div>
 
    <div class="card chart-card">
      <h2>Records</h2>
      <div class="table-controls">
        <select id="rangeFilter">
          <option value="1">Last hour</option>
          <option value="24" selected>Last 24 hours</option>
          <option value="168">Last 7 days</option>
          <option value="0">All time</option>
        </select>
        <label class="pump-only">
          <input type="checkbox" id="pumpOnlyFilter">
          Waterings only
        </label>
        <span class="row-count" id="rowCount"></span>
      </div>
      <div class="table-scroll">
        <table id="recordsTable">
          <thead>
            <tr>
              <th data-key="timestamp">Time</th>
              <th data-key="moisture">Moisture</th>
              <th data-key="pumpOn">Pump</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
 
  <footer>Auto watering system &middot; live via Firebase</footer>
</div>
 
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
